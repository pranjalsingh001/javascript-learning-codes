<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Modern JS RPG Game</title>
  <style>
    body {
      font-family: 'Courier New', monospace;
      background-color: #111;
      color: #eee;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    #game {
      margin: 20px auto;
      width: 80%;
      max-width: 600px;
      padding: 20px;
      background-color: #222;
      border: 2px solid #555;
      border-radius: 10px;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #444;
      color: #fff;
      border: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #666;
    }
  </style>
</head>
<body>
  <h1>🗡️ Modern JavaScript RPG</h1>

  <div id="game">
    <div id="stats">
      <p id="playerStats"></p>
      <p id="enemyStats"></p>
    </div>
    <div id="actions">
      <button id="attackBtn">Attack</button>
      <button id="healBtn">Heal</button>
    </div>
    <p id="message"></p>
  </div>

  <script>
    //chareter created 
    class Character {
        
      constructor(name, health, attackPower) {
        this.name = name;
        this.health = health;
        this.attackPower = attackPower;
      }

      attack(target) {
        target.health -= this.attackPower;
      }

      heal(amount = 10) {
        this.health += amount;
      }
    }

     

    /*
      *******************  BHAIND THE  SCENE  ********************

        -   Creates an empty object → {}.
        -   Sets this to that object.
        -   Runs the constructor() method in the class.
        -   Returns the new object.

      ------------------------------------------------------------
      {
        name: "Hero",
        health: 100,
        attackPower: 10,
        attack: function,
        heal: function
      }

        👇 👇 👇 👇 👇 👇 👇
    */
    const player = new Character("Hero", 100, 10);
    const enemy = new Character("Goblin", 50, 7);


    const playerStats = document.getElementById("playerStats");
    const enemyStats = document.getElementById("enemyStats");
    const message = document.getElementById("message");
    const attackBtn = document.getElementById("attackBtn");
    const healBtn = document.getElementById("healBtn");

    const updateStats = () => {
      playerStats.textContent = `${player.name} - Health: ${player.health}`;
      enemyStats.textContent = `${enemy.name} - Health: ${enemy.health}`;
    };

    const showMessage = (msg) => {
      message.textContent = msg;
    };

    const checkGameOver = () => {
      if (enemy.health <= 0) {
        showMessage(`${enemy.name} is defeated! 🏆`);
        disableButtons();
      } else if (player.health <= 0) {
        showMessage(`${player.name} has been defeated! 💀`);
        disableButtons();
      }
    };

    const disableButtons = () => { // this is edge case
      attackBtn.disabled = true;
      healBtn.disabled = true;
    };

    const handleAttack = () => {
      player.attack(enemy);
      enemy.attack(player);
      updateStats();
      showMessage(`${player.name} attacked ${enemy.name}!`);
      checkGameOver();
    };

    const handleHeal = () => {
      player.heal();
      enemy.attack(player);
      updateStats();
      showMessage(`${player.name} healed!`);
      checkGameOver();
    };

    // Event listeners
    attackBtn.addEventListener("click", handleAttack);
    healBtn.addEventListener("click", handleHeal);

    // Initialize game
    updateStats();
  </script>
</body>
</html>
